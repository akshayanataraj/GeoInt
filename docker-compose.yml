name: geolibre

services:
  geolibre-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: geolibre-web:local
    ports:
      - "${GEOLIBRE_WEB_PORT:-8080}:80"
    environment:
      # Off by default: nothing can be published externally by accident (see
      # docs/self-hosting.md's own recommendation). Point at your own projects
      # server if you stand one up.
      GEOLIBRE_SHARE_URL: "${GEOLIBRE_SHARE_URL:-off}"
      # Origin of a self-hosted "Custom (OpenAI-compatible)" AI Assistant
      # endpoint (e.g. a LAN vLLM/SGLang/Ollama server) to allow in the CSP's
      # connect-src, since the browser calls it directly. Leave unset unless
      # you've configured that provider in the AI settings panel.
      GEOLIBRE_ASSISTANT_ALLOWED_ORIGIN: "${GEOLIBRE_ASSISTANT_ALLOWED_ORIGIN:-}"
    restart: unless-stopped
